<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 165" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .agent-name { font-size: 11px; font-weight: 600; fill: white; }
      .agent-role { font-size: 9px; fill: rgba(255,255,255,0.8); }
      .facilitator-name { font-size: 11px; font-weight: 600; }
      .facilitator-role { font-size: 9px; }
      .arrow { stroke: #d1d5db; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d1d5db"/>
    </marker>
  </defs>

  <rect width="600" height="165" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>

  <text x="25" y="30" font-size="15" font-weight="700" fill="#1a1a2e">🎬  Disney Creative Strategy</text>

  <!-- Facilitator -->
  <rect x="25" y="50" width="80" height="50" rx="8" fill="#f59e0b" opacity="0.15"/>
  <rect x="25" y="50" width="80" height="50" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="65" y="72" text-anchor="middle" class="facilitator-name" fill="#b45309">🎬 Facilitator</text>
  <text x="65" y="86" text-anchor="middle" class="facilitator-role" fill="#b45309">Integrates</text>

  <line x1="115" y1="75" x2="145" y2="75" class="arrow"/>

  <!-- Dreamer -->
  <rect x="155" y="47" width="110" height="56" rx="8" fill="#8b5cf6"/>
  <text x="210" y="72" text-anchor="middle" class="agent-name">💭 Dreamer</text>
  <text x="210" y="86" text-anchor="middle" class="agent-role">Vision without limits</text>

  <line x1="275" y1="75" x2="305" y2="75" class="arrow"/>

  <!-- Realist -->
  <rect x="315" y="47" width="110" height="56" rx="8" fill="#0891b2"/>
  <text x="370" y="72" text-anchor="middle" class="agent-name">📐 Realist</text>
  <text x="370" y="86" text-anchor="middle" class="agent-role">Make it real</text>

  <line x1="435" y1="75" x2="465" y2="75" class="arrow"/>

  <!-- Critic -->
  <rect x="475" y="47" width="110" height="56" rx="8" fill="#ea580c"/>
  <text x="530" y="72" text-anchor="middle" class="agent-name">🔍 Critic</text>
  <text x="530" y="86" text-anchor="middle" class="agent-role">Stress-test the plan</text>

  <!-- Footer -->
  <text x="25" y="135" font-size="9" fill="#9ca3af">The Critic tests the plan, not the dream</text>
  <text x="25" y="150" font-size="9" fill="#9ca3af">Dreamer → Realist → Critic → Integration</text>
</svg>
