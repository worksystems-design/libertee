<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 165" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .agent-name { font-size: 11px; font-weight: 600; fill: white; }
      .agent-role { font-size: 9px; fill: rgba(255,255,255,0.8); }
      .facilitator-name { font-size: 11px; font-weight: 600; }
      .facilitator-role { font-size: 9px; }
      .arrow { stroke: #d1d5db; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d1d5db"/>
    </marker>
  </defs>

  <rect width="600" height="165" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>

  <text x="25" y="30" font-size="15" font-weight="700" fill="#1a1a2e">👥  Wise Crowds (Liberating Structures)</text>

  <!-- Facilitator -->
  <rect x="25" y="50" width="80" height="50" rx="8" fill="#059669" opacity="0.15"/>
  <rect x="25" y="50" width="80" height="50" rx="8" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="65" y="72" text-anchor="middle" class="facilitator-name" fill="#047857">👥 Facilitator</text>
  <text x="65" y="86" text-anchor="middle" class="facilitator-role" fill="#047857">Synthesizes</text>

  <line x1="115" y1="75" x2="145" y2="75" class="arrow"/>

  <!-- Advisor 1 -->
  <rect x="155" y="47" width="80" height="56" rx="8" fill="#059669"/>
  <text x="195" y="72" text-anchor="middle" class="agent-name">💼 Advisor</text>
  <text x="195" y="86" text-anchor="middle" class="agent-role">Perspective 1</text>

  <line x1="245" y1="75" x2="260" y2="75" class="arrow"/>

  <!-- Advisor 2 -->
  <rect x="270" y="47" width="80" height="56" rx="8" fill="#0d9488"/>
  <text x="310" y="72" text-anchor="middle" class="agent-name">🔧 Advisor</text>
  <text x="310" y="86" text-anchor="middle" class="agent-role">Perspective 2</text>

  <line x1="360" y1="75" x2="375" y2="75" class="arrow"/>

  <!-- Advisor 3 -->
  <rect x="385" y="47" width="80" height="56" rx="8" fill="#0891b2"/>
  <text x="425" y="72" text-anchor="middle" class="agent-name">📊 Advisor</text>
  <text x="425" y="86" text-anchor="middle" class="agent-role">Perspective 3</text>

  <line x1="475" y1="75" x2="490" y2="75" class="arrow"/>

  <!-- Advisor 4-5 -->
  <rect x="500" y="47" width="75" height="56" rx="8" fill="#6366f1"/>
  <text x="537" y="72" text-anchor="middle" class="agent-name">··· +</text>
  <text x="537" y="86" text-anchor="middle" class="agent-role">4-5 total</text>

  <!-- Footer -->
  <text x="25" y="135" font-size="9" fill="#9ca3af">Each advisor sees all previous — perspectives build on each other</text>
  <text x="25" y="150" font-size="9" fill="#9ca3af">Convergence · Divergence · Blind Spots · Signal in the Noise</text>
</svg>
